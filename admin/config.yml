backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    files:
      - name: "products"
        label: "Product List"
        file: "products.json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            fields:
              - {label: "Product Name", name: "name", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Price (e.g. 12.99)", name: "price", widget: "string"}
              - {label: "Image", name: "image", widget: "image", required: false}
              - {label: "Amazon Link", name: "link", widget: "string"}

  - name: "settings"
    label: "Website Settings"
    files:
      - name: "settings"
        label: "Homepage & About"
        file: "settings.json"
        fields:
          - {label: "Hero Heading", name: "hero_heading", widget: "string"}
          - {label: "Hero Subheading", name: "hero_subheading", widget: "text"}
          - {label: "Hero Image", name: "hero_image", widget: "image", required: false}
          - {label: "About Text", name: "about_text", widget: "text"}

  - name: "pages"
    label: "Pages"
    files:
      - name: "privacy"
        label: "Privacy Policy"
        file: "privacy.json"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Content", name: "content", widget: "markdown"}
