<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dansy Mart | Beauty Products &amp; Hair Styling Accessories on Amazon UK</title>
<meta name="description" content="Discover hand-picked beauty products and hair styling accessories on Amazon UK.">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF7F0; --cream-deep:#F6EEE3; --white:#FFFFFF;
  --ink:#221C1F; --muted:#6E6470; --rose:#C24E6D; --rose-bright:#E4728F; --rose-soft:#FBE4EA;
  --gold:#C7A76A; --gold-soft:#F0E3C8; --line:rgba(34,28,31,.10);
  --radius:22px; --shadow:0 22px 48px -30px rgba(120,50,80,.55); --shadow-soft:0 10px 26px -20px rgba(120,50,80,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block;height:auto}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:'Playfair Display',serif;margin:0;line-height:1.15}
.container{width:100%;max-width:1180px;margin:0 auto;padding:0 22px}
.section{padding:74px 0}
.section--tint{background:linear-gradient(180deg,var(--cream) 0%,var(--cream-deep) 100%)}
.section-head{max-width:660px;margin:0 0 40px}
.section-head.center{margin-left:auto;margin-right:auto;text-align:center}
.eyebrow{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--rose);margin-bottom:12px}
.section-head h2{font-size:clamp(1.7rem,3.6vw,2.5rem);margin-bottom:12px}
.disclosure-bar{background:linear-gradient(90deg,var(--rose) 0%,var(--rose-bright) 55%,var(--gold) 100%);color:#fff;font-size:12.5px;font-weight:700;text-align:center;padding:9px 16px}
.site-header{position:sticky;top:0;z-index:60;background:rgba(251,247,240,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:74px}
.logo{font-family:'Playfair Display',serif;font-size:23px;font-weight:800;display:flex;align-items:center;gap:9px}
.logo .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(140deg,var(--rose),var(--gold))}
.logo em{font-style:normal;color:var(--rose)}
.nav-links{display:flex;gap:4px}
.nav-links a{padding:9px 15px;border-radius:999px;font-size:14.5px;font-weight:600;color:#4C4249}
.nav-links a:hover{background:var(--rose-soft);color:var(--rose)}
.btn-amazon{display:flex;width:100%;align-items:center;justify-content:center;margin-top:auto;padding:13px 18px;border-radius:999px;background:linear-gradient(100deg,var(--rose),var(--rose-bright));color:#fff;font-weight:800;font-size:14px;box-shadow:0 14px 26px -16px rgba(194,78,109,.95);transition:transform .18s}
.btn-amazon:hover{transform:translateY(-2px)}
.hero{padding:64px 0 78px;text-align:center;background:radial-gradient(900px 420px at 88% -10%,rgba(228,114,143,.20),transparent 70%)}
.hero h1{font-size:clamp(2.3rem,5.4vw,4rem);margin-bottom:20px}
.hero h1 em{font-style:italic;color:var(--rose)}
.hero .lead{font-size:1.09rem;color:var(--muted);max-width:52ch;margin:0 auto 30px}
.grid{display:grid;gap:26px}
.grid-3{grid-template-columns:repeat(3,1fr)}
.p-card{display:flex;flex-direction:column;background:var(--white);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-soft);transition:transform .22s;height:100%}
.p-card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
.p-media{position:relative;aspect-ratio:4/3;display:grid;place-items:center;background:#F8F8F8;overflow:hidden}
.p-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.p-emoji{font-size:56px;z-index:1}
.p-body{display:flex;flex-direction:column;gap:10px;padding:20px;flex:1}
.p-cat{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--gold)}
.p-body h3{font-size:1.09rem}
.p-price{font-family:'Playfair Display',serif;font-size:1.22rem;font-weight:700}
.p-desc{font-size:13.8px;color:var(--muted);flex:1}
.site-footer{background:#221C1F;color:#DED5DA;padding:40px 0;text-align:center}
@media(max-width:768px){.grid-3{grid-template-columns:1fr}.nav-links{display:none}}
</style>
</head>
<body>

<div class="disclosure-bar">As an Amazon Associate I earn from qualifying purchases.</div>

<header class="site-header">
  <div class="container nav">
    <a class="logo" href="#/home"><span class="dot"></span>Dansy<em>Mart</em></a>
    <nav class="nav-links">
      <a href="#/home">Home</a>
      <a href="#/best-sellers">Best Sellers</a>
      <a href="/admin" style="color:var(--rose); border:1px solid var(--rose); margin-left:10px;">Admin Login</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer class="site-footer">
  <div class="container">
    <p style="color:var(--gold);font-weight:700;">As an Amazon Associate I earn from qualifying purchases.</p>
    <p>© <span id="year"></span> Dansy Mart. Prices & availability are subject to change.</p>
  </div>
</footer>

<script>
// 🔥 AAPKA AMAZON TAG YAHAN HAI 🔥
const AMAZON_TAG = 'danish08ee-21';

function getAffiliateLink(url) {
  if (!url) return '#';
  if (url.includes('tag=')) return url;
  const separator = url.includes('?') ? '&' : '?';
  return url + separator + 'tag=' + AMAZON_TAG;
}

// Admin panel se data load karne ke liye
let PRODUCTS = [];
let POSTS = []; // Abhi ke liye khali hai

// ==========================================
// ROUTER (FIXED FOR PASSWORD RESET)
// ==========================================
function router(){
  // YEH LINES 404 ERROR ROKTI HAIN (Password reset ke liye)
  if (location.hash.includes('recovery_token') || location.hash.includes('invite_token') || location.hash.includes('confirmation_token')) {
    return;
  }

  const raw = location.hash.replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  const page = parts[0] || 'home';
  
  let html = '';

  if (page === 'home') {
    html = `
    <section class="hero">
      <div class="container">
        <h1>Discover Your <em>Beauty</em> Essentials</h1>
        <p class="lead">Explore the best beauty and hair styling products on Amazon UK, carefully selected to help you look and feel your best.</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="section-head center">
          <span class="eyebrow">Featured Products</span>
          <h2>Trending beauty picks</h2>
        </div>
        <div class="grid grid-3">
          ${PRODUCTS.map(p => productCard(p)).join('')}
        </div>
      </div>
    </section>`;
  } else if (page === 'best-sellers') {
    html = `
    <section class="section">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow">Best Sellers</span>
          <h2>Our Top Rated Products</h2>
        </div>
        <div class="grid grid-3">
          ${PRODUCTS.map(p => productCard(p)).join('')}
        </div>
      </div>
    </section>`;
  } else {
    html = `<section class="section"><div class="container"><h2>404 - Page Not Found</h2><p><a href="#/home">Go back home</a></p></div></section>`;
  }

  document.getElementById('app').innerHTML = html;
  window.scrollTo(0, 0);
}

// Product Card Design
function productCard(p) {
  const finalLink = getAffiliateLink(p.link);
  return `
  <article class="p-card">
    <div class="p-media">
      ${p.image ? `<img src="${p.image}" alt="${p.name}" loading="lazy">` : `<span class="p-emoji">🛍️</span>`}
    </div>
    <div class="p-body">
      <span class="p-cat">Beauty Pick</span>
      <h3>${p.name}</h3>
      <p class="p-desc">${p.description || ''}</p>
      <div class="p-price">£${p.price}</div>
      <a class="btn-amazon" href="${finalLink}" target="_blank" rel="nofollow sponsored noopener">View on Amazon →</a>
    </div>
  </article>`;
}

// ==========================================
// INITIALIZE APP
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('year').textContent = new Date().getFullYear();

  // Data fetch karein products.json se (jo Admin panel se aata hai)
  fetch('/products.json')
    .then(res => res.json())
    .then(data => {
      PRODUCTS = data.products || [];
      router(); // Data aane ke baad website render hogi
    })
    .catch(err => {
      console.error("Error loading products:", err);
      // Agar file na mile toh khali grid dikhaye
      PRODUCTS = [];
      router();
    });

  window.addEventListener('hashchange', router);
});
</script>
</body>
</html>
