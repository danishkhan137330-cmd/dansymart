media: images
content:
  - name: products
    label: Products
    type: file
    path: products.json
    fields:
      - name: products
        label: Product List
        type: object
        list: true
        fields:
          - {name: name, label: Product Name, type: string}
          - {name: description, label: Description, type: string}
          - {name: price, label: Price (e.g. 12.99), type: string}
          - {name: image, label: Image, type: image}
          - {name: link, label: Amazon Link, type: string}

  - name: categories
    label: "Categories (Home Page)"
    type: file
    path: categories.json
    fields:
      - name: categories
        label: Category List
        type: object
        list: true
        fields:
          - {name: name, label: Category Name, type: string}
          - {name: image, label: Category Image (Upload here), type: image}
          - {name: blurb, label: Short Description, type: string}

  - name: testimonials
    label: "Customer Reviews"
    type: file
    path: testimonials.json
    fields:
      - name: testimonials
        label: Review List
        type: object
        list: true
        fields:
          - {name: review, label: Review Text, type: string}
          - {name: author, label: Customer Name, type: string}
          - {name: role, label: Badge (e.g. Verified Shopper), type: string}

  - name: blog
    label: "Blog Posts"
    type: file
    path: blog.json
    fields:
      - name: posts
        label: Post List
        type: object
        list: true
        fields:
          - {name: title, label: Title, type: string}
          - {name: category, label: Category, type: string}
          - {name: excerpt, label: Short Excerpt, type: string}
          - {name: image, label: Post Image, type: image}

  - name: settings
    label: "Website Settings"
    type: file
    path: settings.json
    fields:
      - {name: hero_heading, label: Hero Heading, type: string}
      - {name: hero_subheading, label: Hero Subheading, type: string}
      - {name: hero_image, label: Hero Front Image, type: image}
      - {name: about_text, label: About Page Text, type: string}

  - name: privacy
    label: "Privacy Policy"
    type: file
    path: privacy.json
    fields:
      - {name: title, label: Page Title, type: string}
      - {name: content, label: Content, type: string}
